name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to test and publish (leave empty for CI only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage (minimum 85% total and resources; every function exercised)
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1)
          echo "$total" | tee -a "$GITHUB_STEP_SUMMARY"
          percentage=$(awk '{gsub(/%/, "", $3); print $3}' <<< "$total")
          awk -v coverage="$percentage" 'BEGIN { if (coverage < 85) exit 1 }'
          resource_percentage=$(awk '$1 ~ /^github.com\/assinafy\/golang-sdk\/v2\/resources\// { statements += $2; if ($3 > 0) covered += $2 } END { if (statements > 0) printf "%.1f", 100 * covered / statements }' coverage.out)
          echo "resources coverage: ${resource_percentage}%" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v coverage="$resource_percentage" 'BEGIN { if (coverage < 85) exit 1 }'
          zero_functions=$(go tool cover -func=coverage.out | awk '$3 == "0.0%" { print }')
          if [[ -n "$zero_functions" ]]; then
            echo "::error::Functions without test coverage:"
            echo "$zero_functions"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.go-version }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test release notes extraction
        run: |
          if [[ -f .github/scripts/test_release_notes.py ]]; then
            python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          fi

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

  release:
    name: Publish release
    needs: [test, quality]
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout release tooling and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.mod

      - name: Prepare release notes
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          git show "refs/tags/${RELEASE_TAG}:CHANGELOG.md" |
            python3 -B .github/scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false --prerelease=false \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Index Go module
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          module=$(git show "refs/tags/${RELEASE_TAG}:go.mod" | awk '$1 == "module" { print $2 }')
          go list -m "$module@$RELEASE_TAG"
