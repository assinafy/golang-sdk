version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      # Test servers deliberately echo request data and parse fixed-size
      # multipart bodies; neither reaches production code.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
